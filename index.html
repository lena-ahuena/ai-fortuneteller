<style>
  :root{
    --bg1:#170F2B; --bg2:#2B1B4A;
    --cyan:#7FE7DE; --violet:#B98CFF; --pink:#F0A8D8;
    --text:#F3EEFF; --text-dim:#B6A9D6;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;overflow-x:hidden;}
  body{
    margin:0;min-height:100vh;min-height:100dvh;
    background:radial-gradient(ellipse at 50% -10%, var(--bg2), var(--bg1) 60%);
    background-attachment:fixed;
    color:var(--text);font-family:'Space Grotesk',sans-serif;
    display:flex;flex-direction:column;align-items:center;
    padding: max(30px, env(safe-area-inset-top)) 20px max(50px, env(safe-area-inset-bottom));
    text-align:center;
    -webkit-user-select:none;user-select:none;
  }
  button, .orb, .card, .theme-btn{
    touch-action: manipulation;
    cursor: pointer;
  }
  .kicker{font-size:.7rem;text-transform:uppercase;letter-spacing:.2em;color:var(--pink);font-weight:700;}
  h1{font-family:'Playfair Display',serif;font-weight:600;font-size:2.1rem;margin:6px 0 4px;color:var(--text);text-shadow:0 0 18px rgba(185,140,255,.5);}
  .sub{color:var(--text-dim);font-size:.88rem;max-width:320px;margin:0 0 22px;}

  .tabs{display:flex;gap:8px;margin-bottom:22px;width:100%;max-width:340px;}
  .tab{flex:1;padding:10px;border-radius:20px;border:1.5px solid var(--violet);background:none;color:var(--text-dim);font-family:inherit;font-size:.82rem;cursor:pointer;}
  .tab.active{background:var(--violet);color:#1a0f33;font-weight:700;border-color:var(--violet);}

  .panel{display:none;width:100%;max-width:340px;}
  .panel.active{display:flex;flex-direction:column;align-items:center;}

  .pay-note{font-size:.76rem;color:var(--pink);font-weight:700;margin-bottom:16px;letter-spacing:.03em;}

  .orb-wrap{position:relative;width:220px;height:220px;margin-bottom:22px;}
  .orb{
    width:100%;height:100%;border-radius:50%;
    background:radial-gradient(circle at 32% 28%, #4a3572, #0c0718 72%);
    box-shadow:0 0 50px rgba(185,140,255,.45), 0 0 90px rgba(127,231,222,.18), inset 0 0 30px rgba(0,0,0,.8);
    display:flex;align-items:center;justify-content:center;cursor:pointer;
    transition:transform .15s;
  }
  .orb:active{transform:scale(.97);}
  .orb.shaking{animation:shake .5s cubic-bezier(.36,.07,.19,.97) both;}
  @keyframes shake{
    10%,90%{transform:translate3d(-2px,0,0) rotate(-1deg);}
    20%,80%{transform:translate3d(4px,0,0) rotate(2deg);}
    30%,50%,70%{transform:translate3d(-8px,0,0) rotate(-4deg);}
    40%,60%{transform:translate3d(8px,0,0) rotate(4deg);}
  }
  .eye{filter:drop-shadow(0 0 8px var(--cyan)) drop-shadow(0 0 16px rgba(127,231,222,.5));}
  .tap-hint{font-size:.78rem;color:var(--text-dim);margin-top:-8px;margin-bottom:18px;}

  .result{
    font-family:'Playfair Display',serif;font-weight:500;
    font-size:1.15rem;line-height:1.5;color:var(--text);
    min-height:70px;display:flex;align-items:center;justify-content:center;
    padding:0 6px;margin-bottom:18px;opacity:0;transition:opacity .4s;
  }
  .result.show{opacity:1;}

  .btn{
    width:100%;padding:14px;border-radius:26px;border:none;
    font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:.92rem;cursor:pointer;
    margin-bottom:10px;
  }
  .btn.primary{background:linear-gradient(135deg,var(--violet),var(--pink));color:#1a0f33;}
  .btn.ghost{background:none;border:1.5px solid var(--text-dim);color:var(--text-dim);}
  .btn:disabled{opacity:.4;}

  .field-label{font-size:.72rem;text-transform:uppercase;letter-spacing:.07em;color:var(--text-dim);margin:6px 0 12px;align-self:center;}

  #resultImg,#resultImgQ{display:none;width:100%;max-width:280px;margin:14px auto;border-radius:10px;border:2px solid rgba(255,255,255,.15);}
  .save-hint{font-size:.78rem;color:var(--cyan);margin-bottom:6px;}

  .q-view{display:none;width:100%;flex-direction:column;align-items:center;}
  .q-view.active{display:flex;}

  .themes{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%;margin-bottom:10px;}
  .theme-btn{
    padding:18px 8px;border-radius:14px;border:1.5px solid var(--violet);
    background:rgba(185,140,255,.08);color:var(--text);
    font-family:inherit;font-size:.9rem;font-weight:600;cursor:pointer;
    transition:background .15s, transform .15s;
    min-height:64px;
  }
  .theme-btn:active{background:rgba(185,140,255,.22);transform:scale(.97);}

  .q-theme-name{
    font-family:'Playfair Display',serif;font-size:1.4rem;
    color:var(--pink);margin:4px 0 14px;text-shadow:0 0 14px rgba(240,168,216,.4);
  }

  .cards{display:flex;gap:12px;justify-content:center;margin:6px 0 18px;}
  .card{
    width:88px;height:136px;border-radius:10px;
    background:radial-gradient(circle at 50% 40%, #3a2560, #150a28);
    border:1.5px solid var(--violet);
    display:flex;align-items:center;justify-content:center;cursor:pointer;
    box-shadow:0 0 22px rgba(185,140,255,.28);
    transition:transform .15s;
  }
  .card:active{transform:scale(.95);}
  .card.shaking{animation:cardShake .6s cubic-bezier(.36,.07,.19,.97) both;}
  @keyframes cardShake{
    10%,90%{transform:translate3d(-1px,0,0) rotate(-2deg);}
    20%,80%{transform:translate3d(3px,0,0) rotate(3deg);}
    30%,50%,70%{transform:translate3d(-6px,0,0) rotate(-5deg);}
    40%,60%{transform:translate3d(6px,0,0) rotate(5deg);}
  }
</style>
</head>

<script>
  /* Универсальный тап: работает и в Safari/iOS, и в Chrome */
  function onTap(el, fn){
    var lastTouch = 0;
    el.addEventListener('touchend', function(e){
      e.preventDefault();
      lastTouch = Date.now();
      fn(e);
    }, {passive:false});
    el.addEventListener('click', function(e){
      if(Date.now() - lastTouch < 500) return;
      fn(e);
    });
  }

  /* ===== CANVAS — чек 50×70 ===== */
  var canvas = document.getElementById('ticketCanvas');
  var ctx = canvas.getContext('2d');

  function wrapAtFont(text, maxWidth, fontSize){
    ctx.save();
    ctx.font = '500 ' + fontSize + 'px "Playfair Display", Georgia, serif';
    var words = text.split(/\s+/);
    var lines = [];
    var cur = '';
    for(var i = 0; i < words.length; i++){
      var test = cur ? cur + ' ' + words[i] : words[i];
      if(ctx.measureText(test).width > maxWidth && cur){
        lines.push(cur); cur = words[i];
      } else { cur = test; }
    }
    if(cur) lines.push(cur);
    ctx.restore();
    return lines;
  }

  function drawVerticalText(lines, fontSize, lineHeight, area){
    ctx.save();
    ctx.translate(area.x + area.w, area.y);
    ctx.rotate(Math.PI / 2);
    ctx.font = '500 ' + fontSize + 'px "Playfair Display", Georgia, serif';
    ctx.fillStyle = '#000';
    ctx.textBaseline = 'middle';
    ctx.textAlign = 'left';
    var n = lines.length;
    var stack = n * lineHeight;
    var ly0 = (area.w - stack) / 2 + lineHeight / 2;
    for(var i = 0; i < n; i++){
      var w = ctx.measureText(lines[i]).width;
      var lx = (area.h - w) / 2;
      var ly = ly0 + i * lineHeight;
      ctx.fillText(lines[i], lx, ly);
    }
    ctx.restore();
  }

  function fitAndDrawText(text, area){
    var MIN_FS = 16, MAX_FS = 40;
    for(var fs = MAX_FS; fs >= MIN_FS; fs--){
      var lh = fs * 1.25;
      var maxLines = Math.floor(area.w / lh);
      if(maxLines < 1) continue;
      var lines = wrapAtFont(text, area.h, fs);
      if(lines.length <= maxLines){
        drawVerticalText(lines, fs, lh, area); return;
      }
    }
    var fs2 = MIN_FS, lh2 = fs2 * 1.25;
    drawVerticalText(wrapAtFont(text, area.h, fs2), fs2, lh2, area);
  }

  function drawTicket(text, targetImg, targetHint){
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    var pad = 30;
    var lw, lh;
    if(logoReady && logoImg.width > 0){
      var maxW = canvas.width - pad * 2;
      lw = maxW;
      lh = logoImg.height * (lw / logoImg.width);
      if(lh > 280){ lh = 280; lw = logoImg.width * (lh / logoImg.height); }
      ctx.drawImage(logoImg, (canvas.width - lw) / 2, pad, lw, lh);
    } else { lh = 200; }

    var divY = pad + lh + 30;
    ctx.strokeStyle = '#000'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(60, divY); ctx.lineTo(canvas.width - 60, divY); ctx.stroke();

    var area = {
      x: pad, y: divY + 40,
      w: canvas.width - pad * 2,
      h: canvas.height - (divY + 40) - 60
    };

    fitAndDrawText(text, area);

    ctx.font = '18px Georgia, serif';
    ctx.fillStyle = '#888';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'alphabetic';
    ctx.fillText('· гадание дня ·', canvas.width / 2, canvas.height - 18);

    targetImg.src = canvas.toDataURL('image/png');
    targetImg.style.display = 'block';
    if(targetHint) targetHint.style.display = 'block';
  }

      orb.classList.remove('shaking');
      var i;
      do { i = Math.floor(Math.random() * POOL_MAT.length); }
      while(i === lastShar && POOL_MAT.length > 1);
      lastShar = i;
      currentFortune = POOL_MAT[i];
      resultText.textContent = currentFortune;
      resultText.classList.add('show');
      tapHint.textContent = '';
      printBtnStd.style.display = 'block';
      againBtn.style.display = 'block';
    }, 600);
  });
